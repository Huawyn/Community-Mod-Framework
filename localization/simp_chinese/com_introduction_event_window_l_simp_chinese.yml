 com_intro_window_region_header: "[GetPlayer.GetCapital.GetStateRegion.GetStrategicRegion.GetNameNoFormatting]周边"
 com_intro_window_region_body: "[GetPlayer.GetCustom('com_intro_window_macroregion_type')][GetPlayer.GetCustom('com_intro_window_subregion_type')][GetPlayer.GetCustom('com_intro_window_rank_type')]$com_intro_window_government_summary$"
 com_intro_window_macroregion_europe: "欧洲正处于深刻的经济与社会转型之中。蒸汽动力生产的普及、冶金技术的改良以及日益增长的机械化彻底革新了工业。随着佃农离开祖辈世代居住的村庄涌向城市中心，整个社会正面临着人口爆炸式增长与新兴阶级意识觉醒的冲击。"
 com_intro_window_macroregion_americas: "美洲正在经历剧烈的变革。新兴的合众国影响力日盛，见证了新大陆各殖民帝国的瓦解，如今仅剩自治程度不断提高的加拿大与加勒比海沿岸的狭小领地仍是欧洲直接统治的最后前哨。新独立的各国不仅要努力构建自身的国家认同，还要面对如何处置无数美洲原住民的难题——这些原住民对与新政权合作毫无兴趣。"
 com_intro_window_macroregion_mena: "中东与马格里布正日益陷入动荡。奥斯曼帝国的持续停滞在地中海各地留下了权力真空，而伊朗崇高国则在俄罗斯扩张的重压下步履维艰。随着“东方问题”与“大博弈”在欧洲政界深入人心，各大列强正企图将西亚彻底沦为各自不断扩张的帝国的殖民前哨。"
 com_intro_window_macroregion_asia: "东亚正笼罩在欧洲帝国主义日益扩大的阴影之下。长期称霸东方的清朝如今正面临欧洲闯入者的挑战。日本依然对外界紧闭国门，而印度次大陆和印度尼西亚群岛则已被殖民列强瓜分殆尽。在中亚，随着俄罗斯与大不列颠争夺霸权，“大博弈”已彻底打破了当地的均势。"
