 com_intro_window_rank_header: "[GetPlayer.GetRank.GetNameNoFormatting]"
 com_intro_window_rank_body: "[GetPlayer.GetCustom('com_intro_window_rank_body')]"
 com_intro_window_rank_great_power: "$com_lb$是[concept_great_power]，[GetPlayer.GetNameNoFlag]在世界秩序中占据主导地位。在与同侪无休止的竞争中，国家力求从弱小国家身上榨取最大利益，同时提防那些野心勃勃、企图以牺牲她们为代价跻身伟大行列的新兴[Concept('concept_major_power','$concept_major_powers|q$')]。"
 com_intro_window_rank_major_minor: "$com_lb$是[concept_major_power]，[GetPlayer.GetNameNoFlag]被公认为其所在[concept_strategic_region]举足轻重的参与者，任何寻求更深入介入该地区的外部势力都必须以某种方式与她打交道。尽管她的实力尚不足以在全球范围内投射力量，但各[Concept('concept_great_power','$concept_great_powers|q$')]仍以审慎的目光注视着她。"
 com_intro_window_rank_minor_insigificant_power: "$com_lb$是[GetPlayer.GetRank]，[GetPlayer.GetNameNoFlag]在各[Concept('concept_major_power','$concept_major_powers|q$')]与[Concept('concept_great_power','$concept_great_powers|q$')]的政治阴谋中不过是一枚棋子。由于几乎没有能力在海外贯彻自身意志，国家只能一边努力争取民族自决权，一边尽量避免成为外国帝国眼中的绊脚石。"
 com_intro_window_rank_unrecognized: "$com_lb$是[concept_unrecognized_power]，[GetPlayer.GetNameNoFlag]被占主导地位的[Concept('concept_great_power','$concept_great_powers|q$')]视为低等且未开化的政权，不过是未来潜在的征服对象。在大多数外交途径对其关闭的情况下，该国必须设法寻求[Concept('concept_recognized_power','$concept_recognition|q$')]，以免沦为帝国主义野心的牺牲品。"
 com_intro_window_rank_decentralized: "$com_lb$#red #bold 是[concept_decentralized_nation]，[GetPlayer.GetNameNoFlag]本不应该看到此事件。如果你看到了这段文字，请在Victoria 3 Modding Co-op频道联系Alexedishi。#!#!"
 com_intro_window_government_summary: "$com_lb$是[GetPlayer.GetGovernment.GetName]，[GetPlayer.GetNameNoFlag]将政治权力赋予[GetPlayer.GetRuler.GetPrimaryRoleTitle]，并实行[GetPlayer.GetGovernment.GetTransferOfPowerName]的[concept_transfer_of_power]制度。"
